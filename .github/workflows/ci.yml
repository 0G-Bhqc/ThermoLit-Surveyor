name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests eval
      - name: Offline test suite (no API keys needed)
        run: python -m unittest discover -s tests -v

  # 真实 API 冒烟测试:仅在配置了 secrets 时运行,失败不阻塞 PR
  integration:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ secrets.SCIVERSE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Sciverse API smoke test
        env:
          SCIVERSE_TOKEN: ${{ secrets.SCIVERSE_TOKEN }}
        run: python -m unittest tests.test_graph_offline.TestSciverseIntegration -v
