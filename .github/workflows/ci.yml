name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests eval
      - name: Offline test suite (no API keys needed)
        run: python -m unittest discover -s tests -v

  # 真实 API 冒烟测试:仅当仓库配置了 SCIVERSE_TOKEN secret 时真正执行,
  # 未配置时该步骤显式跳过(job 本身恒为绿)
  integration:
    runs-on: ubuntu-latest
    needs: test
    env:
      SCIVERSE_TOKEN: ${{ secrets.SCIVERSE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Sciverse API smoke test
        if: ${{ env.SCIVERSE_TOKEN != '' }}
        run: python -m unittest tests.test_graph_offline.TestSciverseIntegration -v
      - name: Skipped notice
        if: ${{ env.SCIVERSE_TOKEN == '' }}
        run: echo "SCIVERSE_TOKEN 未配置,跳过真实 API 冒烟测试"
